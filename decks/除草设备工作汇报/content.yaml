    notes: |
      三张动图是同一套几何：振镜在上方，地面在下方 650 mm，左边光纤进光。区别只在镜片放在哪里。
      平行光只有一片准直镜，光斑约 12.7 mm；后聚焦在振镜后加 F-θ 场镜，光斑约 3.6 mm；前聚焦把聚焦镜放在振镜前，焦点沿圆弧走。
      右下角圆圈是同一比例的地面光斑，可以直接比大小。

