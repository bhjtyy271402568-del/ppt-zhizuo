    title: HVD-YOLO26n-Pose：下采样加 VecAConv，上采样换 DySample
    items:
      - {type: image, src: assets/图/模型_原始结构.png, x: 0.55, y: 1.3, h: 4.95, caption: YOLO26n-Pose（基线）}
