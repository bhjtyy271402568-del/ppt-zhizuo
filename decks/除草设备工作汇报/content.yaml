  - layout: canvas
    kicker: 二　硬件系统
    title: 激光恒流驱动板：36 V 输入、输出 18 A，电流由单片机 DAC 设定
    items:
      - {type: image, src: assets/图/驱动板_三维.jpg, x: 0.55, y: 1.4, w: 3.5, caption: 驱动板三维模型}
      - type: bullets
        x: 4.4
        y: 1.4
        w: 4.55
        h: 4.5
        size: 15
        gap: 10
        items:
          - "__恒流控制__：LT3763 大电流同步降压控制器闭环，STM32G431 给定电流"
          - "2.5 mΩ 采样电阻；DAC 调流，PWM 启停"
          - "__功率级__：上下桥各两只 MOS 管并联，电感 6.8 μH；四层板，功率区与采样区分开"
          - "__保护__：软启动、欠压、输入平均限流，FAULT 故障关断，独立看门狗"
      - {type: text, x: 9.3, y: 1.4, w: 3.48, text: 电流设定链路, size: 15, bold: true}
      - type: text
        x: 9.3
        y: 1.85
        w: 3.48
        size: 13
        spacing: 1.3
        text:
          - "V_CTRL1 = D / 4095 × 3.3 V × 8.2 / 18.2"
          - "　　　 ≈ D × 0.363 mV"
          - "I_OUT = 13.6 A/V × V_CTRL1"
          - "　　　 ≈ D × 4.94 mA"
          - "I_OUT = 18 A　→　**D = 3645**"
      - {type: rule, x: 9.3, y: 3.75, w: 3.48, h: 0.01}
      - type: text
        x: 9.3
        y: 3.9
        w: 3.48
        size: 12
        color: mid
        spacing: 1.25
        text:
          - "主控 STM32G431 的四件事："
          - "DAC 输出控制电压 → CTRL1，设定电流"
          - "GPIO → PWM 引脚，启停"
          - "ADC 读电流监测，判断是否到达设定值"
          - "收到 FAULT：拉低 PWM、DAC 清零"
    note: "设计需求：36 V 直流供电，目标输出电流 18 A，输出电压调节上限约 29.2 V"
    notes: |
      驱动板负责激光器的电流调节、启停和状态监测。核心是 LT3763 恒流控制器，单片机用 DAC 设定电流。
      右边是电流设定链路：DAC 码值 D 经分压送到 CTRL1，输出电流约等于 D 乘 4.94 mA，18 A 对应 D = 3645。

