          - [光束直径, 12 mm]
          - [发散半角, 2.8 mrad]
          - [地面光斑, 12.7 mm]
          - [高度 ±100 mm, 12.5–12.9 mm]
          - [功率密度, 约 210 W/cm²]
      - {type: rule, x: 0.55, y: 5.0, w: 12.23, h: 0.01}
      - type: text
        x: 0.55
        y: 5.15
        w: 12.23
        size: 16
        spacing: 1.35
        text:
          - "纤芯上每一点经准直镜后都变成一束平行光，但方向各不相同，所以整束光带一个发散角 θ = r / f₁。"
          - "光斑约等于准直后的光束直径，对地面高度不敏感：高度变化 ±100 mm，光斑只在 12.5–12.9 mm 之间。"
          - "缺点是光斑大、功率密度低，只有后聚焦的 1/12，所以平台不用这种光路。"
    refs: "地面光斑按光程 0.75 m、M² 高斯光束计算"
    notes: |
      红点是纤芯上的一个发光点，经准直镜后变成一束平行光；发光点位置不同，平行光方向不同，所以整束光有发散角，等于纤芯半径除以焦距。
      平行光光路的好处是对高度不敏感，缺点是光斑大、功率密度低。

