  # ================================================================== 光路
  - layout: canvas
    title: 三种扫描光路
    items:
      - {type: image, src: assets/动图/光路_三种对比.gif, x: 0.55, y: 1.2, w: 12.23, h: 5.6}
    refs: ["915 nm，芯径 155 μm、NA 0.22（M² ≈ 58）", "平行光、后聚焦按进振镜光束 12 mm 估算；前聚焦按 B 方案镜组计算"]
    notes: |
      三个面板是同一套几何：振镜在上，地面在下方 650 mm，振镜同步摆动，区别只在镜片放在哪里。
      平行光只有一片准直镜，光斑 12.7 mm；后聚焦在振镜后加 F-θ 场镜，光斑 3.6 mm，焦点始终在地面上，这是平台现在用的光路。
      前聚焦把聚焦镜组放在振镜前。焦点本来沿以振镜为圆心的圆弧走（蓝色虚线），把聚焦镜组做成动镜 + 物镜，动镜随转角移动，焦点就拉回到地面，这就是动态聚焦。
      光斑大小还和进振镜的光束直径有关，前聚焦这里按 B 方案镜组算，出光更粗，所以光斑更小。

  - layout: canvas
    title: 平行光：单镜片准直
    items:
