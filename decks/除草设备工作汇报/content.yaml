  - layout: canvas
    title: 后聚焦：振镜 + F-θ 场镜
    items:
      - {type: image, src: assets/动图/振镜扫描_三维.gif, x: 0.35, y: 1.2, w: 8.75}
      - {type: text, x: 9.3, y: 1.35, w: 3.48, text: "光路：", size: 18, bold: true}
      - {type: text, x: 9.3, y: 1.77, w: 3.48, text: ["准直镜 → X 镜 → Y 镜", "→ F-θ 场镜 → 杂草茎部"], size: 15, spacing: 1.3}
      - {type: text, x: 9.3, y: 2.65, w: 3.48, text: "扫描：", size: 18, bold: true}
      - type: bullets
        x: 9.3
        y: 3.05
        w: 3.48
        h: 1.6
        size: 15
        gap: 4
        items:
          - "X 镜管 x 向，Y 镜管 y 向"
          - "镜片转 θ，光束偏转 2θ"
          - "落点 = f × 偏转角"
          - "350 mm 幅面只需转 ±7.7°"
      - {type: text, x: 9.3, y: 4.62, w: 3.48, text: "光斑：", size: 18, bold: true}
      - type: table
        x: 9.3
        y: 5.0
        w: 3.48
        style: plain
        size: 15
        row_h: 0.34
        widths: [1.7, 1.78]
        rows:
          - [纤芯成像, 3.7 mm]
          - [高斯光束计算, 3.6 mm]
          - [焦深, ±86 mm]
    note: "平台目前采用的光路：光斑 3.6 mm，约 2580 W/cm²，是平行光的 12.5 倍"
    notes: |
      这是平台现在用的后聚焦光路。两块振镜各管一个方向：X 镜绕竖直轴转管 x，Y 镜绕水平轴转管 y。镜片转 θ，光束偏转 2θ；F-θ 场镜让落点等于焦距乘偏转角。
      动画里先算好每株杂草茎部的坐标，再反求两块镜片的转角；跳转时关光，到位后出光，打过的杂草变黄。
      光斑就是纤芯经准直镜和场镜成的像：155 μm 乘 650 除以 27.3，约 3.7 mm，按高斯光束算是 3.6 mm。

  - layout: canvas
    title: 前聚焦：动态聚焦
    items:
      - {type: image, src: assets/动图/原理_动态聚焦.gif, x: 0.3, y: 1.15, w: 9.6}
      - {type: text, x: 10.1, y: 1.35, w: 2.68, text: "原理：", size: 18, bold: true}
      - type: text
        x: 10.1
        y: 1.77
        w: 2.68
        size: 15
        spacing: 1.3
        text:
          - "聚焦镜组放在振镜前，由动镜（负）+ 物镜（正）组成"
          - "动镜后退 → 空气隙变大 → 焦点拉近"
        gap: 6
      - {type: text, x: 10.1, y: 3.55, w: 2.68, text: "915 nm 结果：", size: 18, bold: true}
      - type: bullets
        x: 10.1
        y: 3.95
        w: 2.68
        h: 2.7
        size: 15
        gap: 5
        items:
          - "1–10 m 行程 7.94 mm"
          - "1 m 光斑 3.6 mm"
          - "不调焦时 13.3 mm"
          - "功率密度约 14 倍"
          - "5 m 外受 M² 限制"
    refs: "B 方案镜组（BICV-FS04 + LA4904 + LB4842），915 nm 熔石英折射率逐面光线追迹"
    notes: |
      前聚焦把聚焦镜组放在振镜前，镜组由一片负透镜（动镜）和两片正透镜（物镜）组成。动镜往后退，两者之间的空气隙变大，焦点就拉近。
      从 10 m 到 1 m，动镜走 7.94 mm，刻度尺可以看到大部分行程用在 1 到 3 m。
      1 m 处光斑 3.6 mm，不调焦是 13.3 mm，功率密度差约 14 倍；5 m 以外光斑都在 19 mm 以上，这是激光器 M² 决定的。

  - layout: canvas
