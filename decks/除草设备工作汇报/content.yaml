      - {type: text, x: 9.95, y: 1.4, w: 2.83, text: VecAConv, size: 14, bold: true}
      - {type: text, x: 9.95, y: 1.75, w: 2.83, text: 加在 P3、P4 下采样层；通道、空间、行列三路门控，强调茎部局部特征, size: 12, color: mid, spacing: 1.25}
      - {type: text, x: 9.95, y: 2.75, w: 2.83, text: 分层差异化, size: 14, bold: true}
