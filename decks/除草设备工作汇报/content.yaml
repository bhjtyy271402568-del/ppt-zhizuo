      - {type: text, x: 4.2, y: 1.78, w: 4.6, text: "36 V 输入，输出 18 A，电压上限约 29.2 V", size: 16}
      - {type: text, x: 4.2, y: 2.55, w: 4.6, text: "方案：", size: 18, bold: true}
      - type: bullets
        x: 4.2
        y: 2.95
        w: 4.6
        h: 3.2
        size: 16
        gap: 6
        items:
          - "LT3763 闭环恒流，STM32G431 给定电流"
          - "2.5 mΩ 采样，DAC 调流，PWM 启停"
          - "上下桥各两只 MOS 并联，电感 6.8 μH"
          - "四层板，功率区与采样区分开"
          - "软启动、欠压、限流、FAULT 关断"
      - {type: text, x: 9.05, y: 1.35, w: 3.75, text: "电流设定链路：", size: 18, bold: true}
      - type: text
        x: 9.05
        y: 1.85
        w: 3.75
        size: 15
        spacing: 1.4
        text:
          - "V(CTRL1) = D/4095 × 3.3 V"
          - "　　　　　× 8.2/18.2"
          - "　　　　≈ D × 0.363 mV"
          - "I(OUT) = 13.6 A/V × V(CTRL1)"
          - "　　　　≈ D × 4.94 mA"
          - "18 A 对应 D = 3645"
    notes: |
      驱动板以 LT3763 为核心做恒流，单片机用 DAC 设定电流。右边是设定链路：DAC 码值 D 经分压送到 CTRL1，输出电流约等于 D 乘 4.94 mA，18 A 对应 D 为 3645。

  - layout: canvas
    title: 驱动板阶梯测试
    items:
      - {type: image, src: assets/图/驱动板_线性度.png, x: 0.55, y: 1.35, w: 5.15}
      - type: table
        x: 5.95
        y: 1.4
        w: 6.83
        row_h: 0.44
        size: 15
        widths: [1.1, 1.25, 1.5, 1.1, 1.13, 0.75]
        align: [center, center, center, center, center, center]
        rows:
          - [电流 / A, DAC 码值, 负载, 电压 / V, 功率 / W, 结果]
          - ["6", "1215", "1 Ω + 2 Ω", "18.0", "108", 通过]
          - ["8", "1620", "2 Ω", "16.0", "128", 通过]
          - ["10", "2025", "1 Ω", "10.0", "100", 通过]
          - ["12", "2430", "1 Ω", "12.0", "144", 通过]
          - ["14", "2835", "1 Ω ∥ 6 Ω", "12.0", "168", 通过]
          - ["16", "3240", "1 Ω ∥ 2 Ω", "10.7", "171", 通过]
          - ["18", "3645", "1 Ω ∥ 2 Ω", "12.0", "216", 通过]
      - type: bullets
        x: 5.95
        y: 5.12
        w: 6.83
        h: 1.4
        size: 15
        gap: 4
        items:
          - "DAC 每档加 405 码（约 2 A），七档全部达到设定电流"
          - "CTRL1 斜率实测 36.6 mV / 100 码，理论 36.3 mV，偏差 < 1%"
    notes: |
      阶梯测试从 6 A 到 18 A 共七档，全部达到设定电流，最高 216 W。左边是线性度：负载电压法和理论值基本重合，R1 法略高，与采样电阻公差和毫伏级读数误差相符。

  - layout: canvas
    title: 振镜控制板
    items:
      - {type: image, src: assets/图/控制板_外设接口原理图.png, x: 0.55, y: 1.35, w: 3.75, h: 2.9, valign: middle, caption: 外设接口原理图, cap_size: 14}
