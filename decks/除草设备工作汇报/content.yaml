      - {type: text, x: 6.85, y: 4.8, w: 5.93, text: "主控与供电：", size: 18, bold: true}
      - type: bullets
        x: 6.85
        y: 5.2
        w: 5.93
        h: 1.5
        size: 16
        gap: 4
        items:
          - "STM32F405RGT6，JTAG / SWD 调试"
          - "24 V 输入，转 5 V / 3.3 V；串口转 USB"
          - "振镜差分信号走顶层，电源走底层"
    notes: |
      振镜控制板以 STM32F405 为核心，对外有 XY2-100 振镜接口和 DB25 激光器接口。原理图、PCB 到实物都已完成。

  # ================================================================== 光路
  - layout: canvas
    title: 三种扫描光路
    items:
      - {type: image, src: assets/动图/光路_平行光.gif, x: 0.55, y: 1.2, w: 3.95}
      - {type: image, src: assets/动图/光路_后聚焦.gif, x: 4.69, y: 1.2, w: 3.95}
      - {type: image, src: assets/动图/光路_前聚焦.gif, x: 8.83, y: 1.2, w: 3.95}
      - {type: text, x: 0.55, y: 5.42, w: 3.95, text: 平行光（单镜片准直）, size: 17, bold: true, align: center}
      - {type: text, x: 0.55, y: 5.80, w: 3.95, text: "光斑 12.7 mm，约 210 W/cm²", size: 15, align: center}
      - {type: text, x: 4.69, y: 5.42, w: 3.95, text: 后聚焦（准直 + 振镜 + 场镜）, size: 17, bold: true, align: center}
      - {type: text, x: 4.69, y: 5.80, w: 3.95, text: "光斑 3.6 mm，约 2580 W/cm²", size: 15, align: center}
      - {type: text, x: 8.83, y: 5.42, w: 3.95, text: 前聚焦（聚焦镜在振镜前）, size: 17, bold: true, align: center}
      - {type: text, x: 8.83, y: 5.80, w: 3.95, text: "光斑 4.6 mm，焦点沿圆弧", size: 15, align: center}
    note: "平台目前采用后聚焦；前聚焦不需要大口径场镜，可加动镜随距离调焦"
    refs: "915 nm，芯径 155 μm，NA 0.22；进振镜光束按 12 mm 估算，待按实际准直镜更新"
    notes: |
      三张图是同一套几何：振镜在上，地面在下 650 mm，区别只在镜片放在哪。右侧圆圈是同一比例的地面光斑。

  - layout: canvas
    title: 单镜片准直（平行光光路）
    items:
      - {type: image, src: assets/动图/原理_单镜片准直.gif, x: 0.55, y: 1.3, w: 8.6}
      - {type: text, x: 9.35, y: 1.4, w: 3.4, text: "计算结果：", size: 18, bold: true}
      - type: table
        x: 9.35
        y: 1.85
        w: 3.43
        style: plain
        size: 15
        row_h: 0.42
        widths: [1.6, 1.83]
        rows:
          - [准直镜焦距, ≈ 27 mm]
          - [光束直径, 12 mm]
          - [发散半角, 2.8 mrad]
          - [地面光斑, 12.7 mm]
          - [起伏 ±100 mm, 12.5–12.9 mm]
          - [平均功率密度, 约 210 W/cm²]
      - type: text
        x: 0.75
        y: 5.35
        w: 8.2
        size: 16
        spacing: 1.3
        text:
          - "纤芯上每一点经准直镜后变成一束平行光，方向各不相同，整束光带发散角 r / f₁"
          - "光斑约等于准直后的光束直径，高度变化影响很小，但功率密度低"
    refs: "地面光斑按光程 0.75 m、M² 高斯光束计算"
    notes: |
      红点是纤芯上的一个发光点，经准直镜后变成一束平行光；发光点位置不同，平行光方向不同，所以整束光有一个发散角，等于纤芯半径除以焦距。平行光光路的光斑几乎不随高度变化，但功率密度低。

  - layout: canvas
    title: 双镜片聚焦
    items:
      - {type: image, src: assets/动图/原理_双镜片聚焦.gif, x: 0.55, y: 1.3, w: 8.6}
      - {type: text, x: 9.35, y: 1.4, w: 3.4, text: "计算结果：", size: 18, bold: true}
      - type: table
        x: 9.35
        y: 1.85
        w: 3.43
        style: plain
        size: 15
        row_h: 0.42
        widths: [1.6, 1.83]
        rows:
          - [准直镜 f₁, ≈ 27 mm]
          - [场镜 f₂, 650 mm]
          - [纤芯的像, 3.7 mm]
          - [高斯光束计算, 3.6 mm]
          - [焦深（±10%）, ±86 mm]
          - [平均功率密度, 约 2580 W/cm²]
      - type: text
        x: 0.75
        y: 5.35
        w: 8.2
        size: 16
        spacing: 1.3
        text:
          - "第二片镜把每束平行光会聚到焦平面上一点，纤芯被成像，像就是光斑"
          - "光斑 d = 芯径 × f₂ / f₁；功率密度是平行光的 12.5 倍"
    refs: "纤芯的像 155 μm × 650 / 27.3 = 3.7 mm；高斯光束计算含准直光的残余发散"
    notes: |
      在准直镜后再加一片聚焦镜，纤芯被成像到焦平面上，像的大小就是光斑，约 3.6 mm，功率密度是平行光的 12.5 倍。

  - layout: canvas
    title: Zemax 仿真：准直与聚焦（915 nm）
    items:
      - {type: text, x: 0.55, y: 1.3, w: 5.95, text: "单镜片准直", size: 18, bold: true}
      - {type: placeholder, x: 0.55, y: 1.75, w: 5.95, h: 2.25, title: 光路图（待补）, note: "光纤点光源 155 μm / NA 0.22 → 准直镜"}
      - {type: placeholder, x: 0.55, y: 4.15, w: 5.95, h: 2.25, title: 光束足迹 / POP（待补）, note: "准直镜后 0.1 m、0.75 m 处"}
      - {type: text, x: 6.83, y: 1.3, w: 5.95, text: "双镜片聚焦", size: 18, bold: true}
      - {type: placeholder, x: 6.83, y: 1.75, w: 5.95, h: 2.25, title: 光路图（待补）, note: "准直镜 + 场镜，含振镜偏转"}
      - {type: placeholder, x: 6.83, y: 4.15, w: 5.95, h: 2.25, title: 点列图 / POP（待补）, note: "视场中心与边缘 ±175 mm"}
    notes: |
      这一页放 915 nm 下准直和聚焦的 Zemax 仿真结果。

  - layout: canvas
    title: 后聚焦光路与振镜扫描
    items:
      - {type: image, src: assets/动图/振镜扫描_三维.gif, x: 0.4, y: 1.18, w: 8.65}
      - {type: text, x: 9.3, y: 1.4, w: 3.5, text: "光路：", size: 18, bold: true}
      - {type: text, x: 9.3, y: 1.82, w: 3.5, text: ["准直镜 → X 镜 → Y 镜", "→ F-θ 场镜 → 杂草茎部"], size: 16, spacing: 1.3}
      - {type: text, x: 9.3, y: 2.72, w: 3.5, text: "关系：", size: 18, bold: true}
      - type: bullets
        x: 9.3
        y: 3.12
        w: 3.5
        h: 2.2
        size: 16
        gap: 5
        items:
          - "镜片转 θ，光束偏转 2θ"
          - "落点 = f × 偏转角（F-θ）"
          - "350 mm 幅面只需转 ±7.7°"
      - {type: text, x: 9.3, y: 4.68, w: 3.5, text: "结果：", size: 18, bold: true}
      - type: bullets
        x: 9.3
        y: 5.08
        w: 3.5
        h: 1.6
        size: 16
        gap: 5
        items:
          - "光斑 3.6 mm，焦深 ±86 mm"
          - "焦点始终落在作业面上"
    notes: |
      这是平台现在用的后聚焦光路。两块振镜各管一个方向：X 镜绕竖直轴转管 x，Y 镜绕水平轴转管 y。镜片转 θ，光束偏转 2θ，再经 F-θ 场镜，落点等于焦距乘偏转角。
      动画里先算好每株杂草茎部的位置，再反求两块镜片的转角；跳转时关光，到位后出光。

  - layout: canvas
    title: 前聚焦光路
    items:
      - {type: image, src: assets/动图/光路_前聚焦.gif, x: 0.55, y: 1.2, w: 5.2}
      - type: table
        x: 6.15
        y: 1.4
        w: 6.63
        row_h: 0.5
        size: 15
        widths: [1.5, 2.3, 2.83]
        align: [left, left, left]
        rows:
          - ["", 后聚焦, 前聚焦]
          - [光斑, 3.6 mm, 4.6 mm]
          - [焦点轨迹, 平面, "圆弧，边缘离焦 23 mm"]
          - [焦深, ±86 mm, ±143 mm]
          - [落点与转角, x = f·θ, "x = R·tanθ，边缘偏 2.4%"]
          - [关键镜片, F-θ 场镜（M102）, 小口径聚焦镜]
          - [随距离调焦, 不能, 换成动镜 + 物镜即可]
      - type: text
        x: 6.15
        y: 5.15
        w: 6.63
        size: 16
        spacing: 1.3
        text:
          - "M² 大，焦深也大：23 mm 的边缘离焦只让光斑增大 0.3%"
          - "前聚焦真正的用处是调焦，见下一页"
    notes: |
