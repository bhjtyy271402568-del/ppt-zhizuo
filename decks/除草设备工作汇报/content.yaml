  - layout: canvas
    kicker: 三　光路设计与动态聚焦
    title: Z 轴测距聚焦：测斜距 L，换算高度 H，Z 轴闭环保持 H = F
    items:
      - {type: image, src: assets/图/Z轴_机构_右.png, x: 0.55, y: 1.35, w: 4.2, caption: Z 轴移动模组与测距传感器布置}
      - {type: image, src: assets/动图/原理_Z轴测距聚焦.gif, x: 5.05, y: 1.25, w: 7.73}
      - type: bullets
        x: 0.55
        y: 5.65
        w: 4.3
        h: 1.2
        size: 12
        gap: 2
        items:
          - "激光垂直入射；测距光束与激光束在同一竖直平面"
          - "传感器倾斜 β 安装：H = F 时两束光打在同一点"
    note: "测距传感器测的是沿自身光束的斜距 L，高度按 H = L·cosβ 换算；Δ = H − F 决定 Z 轴升降"
    notes: |
      这是另一种调焦方式：整个激光头装在 Z 轴模组上，旁边斜装一个测距传感器。
      传感器测到的是沿它自己光束方向的斜距 L，乘以 cosβ 就是激光头到地面的高度 H。H 比焦距大就下降，小就上升，闭环让 H 始终等于焦距。
      地面起伏时，激光头跟着地面升降。

