<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url("node_modules/@fontsource/noto-sans-sc/400.css");
  @import url("node_modules/@fontsource/noto-sans-sc/500.css");
  html, body { margin: 0; background: #fff; overflow: hidden; }
  #wrap { position: relative; width: 1400px; height: 900px; font-family: 'Noto Sans SC', sans-serif; }
  canvas { display: block; }
  .lab { position: absolute; font-size: 21px; color: #111; white-space: nowrap; }
  .lab.r { transform: translateX(-100%); }
  .hud { position: absolute; left: 36px; top: 30px; font-size: 22px; color: #111; line-height: 1.6; }
  .hud b { font-weight: 500; }
  .red { color: #A6011C; }
  svg.lead { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head><body>
<div id="wrap"><div class="hud" id="hud"></div><svg class="lead" id="lead" width="1400" height="900"></svg></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1400, H = 900;
const F = 650;                        // 场镜焦距 mm
const YB = 760;                       // 入射光束高度
const OX = new THREE.Vector3(0, YB, 0);       // X 镜中心
const OY = new THREE.Vector3(0, YB, 28);      // Y 镜中心
const LENS_TOP = YB - 52, LENS_BOT = YB - 112; // 场镜上下表面
const AX = new THREE.Vector3(0, 0, 28);       // 场镜光轴在地面的交点

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.getElementById("wrap").prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

const cam = new THREE.PerspectiveCamera(27, W / H, 10, 10000);
cam.position.set(1250, 1180, 1850); cam.lookAt(-20, 360, 30);
cam.updateMatrixWorld(); cam.updateProjectionMatrix();

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(500, 1400, 700); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -600, right: 600, top: 600, bottom: -600, near: 100, far: 3000 });
scene.add(sun);

// ---------- 地面：土壤 + 350 × 350 mm 作业区 ----------
function soilTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d"); g.fillStyle = "#e6dccb"; g.fillRect(0, 0, 1024, 1024);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9000; i++) {
    const v = 190 + rnd() * 40 | 0; g.fillStyle = `rgba(${v},${v - 14},${v - 34},${0.25 + rnd() * 0.35})`;
    const r = 1 + rnd() * 3.5; g.beginPath(); g.arc(rnd() * 1024, rnd() * 1024, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(760, 760), new THREE.MeshStandardMaterial({ map: soilTexture(), roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, 28); ground.receiveShadow = true; scene.add(ground);
const fieldPts = [[-175, -175], [175, -175], [175, 175], [-175, 175], [-175, -175]].map(([x, z]) => new THREE.Vector3(x, 0.6, z + 28));
const field = new THREE.Line(new THREE.BufferGeometry().setFromPoints(fieldPts), new THREE.LineDashedMaterial({ color: 0x555555, dashSize: 10, gapSize: 7 }));
field.computeLineDistances(); scene.add(field);

// ---------- 杂草：几片叶子，茎部在 (x, z) ----------
const WEEDS = [[-118, 96], [-36, -108], [64, 36], [142, -58], [-138, -34], [18, 142], [118, 122], [-60, 20]];
const leafMat = new THREE.MeshStandardMaterial({ color: 0x4f8a2e, roughness: 0.75, side: THREE.DoubleSide });
const burnMats = [];
function leafGeom(len, wid) {
  const s = new THREE.Shape(); s.moveTo(0, 0);
  s.quadraticCurveTo(wid, len * 0.45, 0, len); s.quadraticCurveTo(-wid, len * 0.45, 0, 0);
  return new THREE.ShapeGeometry(s, 10);
}
WEEDS.forEach(([x, z], k) => {
  const g = new THREE.Group(); g.position.set(x, 0, z + 28);
  const n = 6 + (k % 3);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(leafGeom(34 + (i * 9 + k * 5) % 20, 9), leafMat);
    m.rotation.order = 'YXZ'; m.rotation.y = (i / n) * Math.PI * 2 + k; m.rotation.x = -0.75 - (i % 2) * 0.35; m.castShadow = true; g.add(m);
  }
  const burn = new THREE.Mesh(new THREE.CircleGeometry(6, 24), new THREE.MeshBasicMaterial({ color: 0x2a1a10, transparent: true, opacity: 0 }));
  burn.rotation.x = -Math.PI / 2; burn.position.y = 0.8; g.add(burn); burnMats.push(burn.material);
  scene.add(g);
});

// ---------- 振镜：半透明外壳 + 两块镜片 + 两个电机 ----------
const metal = new THREE.MeshStandardMaterial({ color: 0x9aa2ab, metalness: 0.85, roughness: 0.32 });
const dark = new THREE.MeshStandardMaterial({ color: 0x3b4048, metalness: 0.6, roughness: 0.45 });
const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xf2f6fa, metalness: 0.55, roughness: 0.18, emissive: 0x9aa6b4, emissiveIntensity: 0.25, side: THREE.DoubleSide });
const shell = new THREE.Mesh(new THREE.BoxGeometry(120, 96, 110), new THREE.MeshStandardMaterial({ color: 0xc9ced4, transparent: true, opacity: 0.16, roughness: 0.4, depthWrite: false }));
shell.position.set(8, YB + 6, 22); scene.add(shell);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(shell.geometry), new THREE.LineBasicMaterial({ color: 0x6b727b }));
edges.position.copy(shell.position); scene.add(edges);
// X 电机（竖直轴，在 X 镜上方）、Y 电机（水平 x 轴，在 Y 镜一侧）
// 电机离镜片一段距离，中间是细轴（真实振镜的镜片装在电机轴末端）
const motX = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 40, 32), dark); motX.position.set(0, YB + 52, 0); motX.castShadow = true; scene.add(motX);
const shaftX = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 24, 12), metal); shaftX.position.set(0, YB + 20, 0); scene.add(shaftX);
const motY = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 40, 32), dark); motY.rotation.z = Math.PI / 2; motY.position.set(52, YB, 28); motY.castShadow = true; scene.add(motY);
const shaftY = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 22, 12), metal); shaftY.rotation.z = Math.PI / 2; shaftY.position.set(22, YB, 28); scene.add(shaftY);
const mirX = new THREE.Mesh(new THREE.BoxGeometry(2, 18, 26), mirrorMat); scene.add(mirX);
const mirY = new THREE.Mesh(new THREE.BoxGeometry(30, 2, 22), mirrorMat); scene.add(mirY);

// ---------- 准直镜筒 + 光纤 ----------
const coll = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, 90, 32), metal);
coll.rotation.z = Math.PI / 2; coll.position.set(-120, YB, 0); coll.castShadow = true; scene.add(coll);
const sma = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 22, 24), dark); sma.rotation.z = Math.PI / 2; sma.position.set(-176, YB, 0); scene.add(sma);
const fiberCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(-187, YB, 0), new THREE.Vector3(-240, YB, -10), new THREE.Vector3(-300, YB - 80, -40), new THREE.Vector3(-330, YB - 230, -40)]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(fiberCurve, 40, 3.2, 12), new THREE.MeshStandardMaterial({ color: 0xe0a530, roughness: 0.5 })));

// ---------- F-θ 场镜：镜筒 + 底部镜片 ----------
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(56, 56, LENS_TOP - LENS_BOT, 64, 1, true), new THREE.MeshStandardMaterial({ color: 0x2f3338, metalness: 0.5, roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.55 }));
barrel.position.set(0, (LENS_TOP + LENS_BOT) / 2, 28); scene.add(barrel);
const ring = new THREE.Mesh(new THREE.TorusGeometry(56, 2.2, 12, 64), dark); ring.rotation.x = Math.PI / 2; ring.position.set(0, LENS_TOP, 28); scene.add(ring);
const glass = new THREE.Mesh(new THREE.SphereGeometry(140, 64, 16, 0, Math.PI * 2, 0, 0.41), new THREE.MeshPhysicalMaterial({ color: 0xbfd9ee, transmission: 0.6, roughness: 0.05, transparent: true, opacity: 0.55, metalness: 0 }));
glass.rotation.x = Math.PI; glass.position.set(0, LENS_BOT + 140 - 8, 28); scene.add(glass);
const ring2 = ring.clone(); ring2.position.y = LENS_BOT; scene.add(ring2);

// ---------- 光束 ----------
const beamMat = new THREE.MeshBasicMaterial({ color: 0xd0263a, transparent: true, opacity: 0.62, depthWrite: false });
const coreMat = new THREE.LineBasicMaterial({ color: 0xa6011c });
function makeBeam() { const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 24, 1, true), beamMat); scene.add(m); return m; }
const b0 = makeBeam(), b1 = makeBeam(), b2 = makeBeam(), b3 = makeBeam();
function placeBeam(m, a, b, r0, r1) {
  const d = new THREE.Vector3().subVectors(b, a), L = d.length();
  m.geometry.dispose(); m.geometry = new THREE.CylinderGeometry(r1, r0, L, 28, 1, true);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}
const spot = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color: 0xff3b2f, transparent: true, opacity: 0.85 }));
spot.rotation.x = -Math.PI / 2; scene.add(spot);
const glow = new THREE.Mesh(new THREE.CircleGeometry(22, 32), new THREE.MeshBasicMaterial({ color: 0xff7a3a, transparent: true, opacity: 0.25 }));
glow.rotation.x = -Math.PI / 2; scene.add(glow);

// ---------- 光路计算 ----------
const reflect = (d, n) => d.clone().addScaledVector(n, -2 * d.dot(n));
const nX0 = new THREE.Vector3(-1, 0, 1).normalize();     // 入射 +x → 出射 +z
const nY0 = new THREE.Vector3(0, -1, -1).normalize();    // 入射 +z → 出射 −y
function trace(a, b) {      // a、b：X、Y 镜机械转角（弧度）
  const nX = nX0.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
  const d1 = reflect(new THREE.Vector3(1, 0, 0), nX);
  const nY = nY0.clone().applyAxisAngle(new THREE.Vector3(1, 0, 0), b);
  const t = new THREE.Vector3().subVectors(OY, OX).dot(nY) / d1.dot(nY);
  const pY = OX.clone().addScaledVector(d1, t);
  const d2 = reflect(d1, nY);
  return { nX, nY, d1, d2, pY };
}
// F-θ：落点 = f × 光学偏转角（相对光轴 −y）
function landing(a, b) {
  const { d2 } = trace(a, b);
  return [AX.x + F * Math.atan2(d2.x, -d2.y), AX.z + F * Math.atan2(d2.z, -d2.y)];
}
// 牛顿迭代反求两块镜片的转角
function solve(x, z) {
  let a = (x - AX.x) / F / 2, b = -(z - AX.z) / F / 2;
  for (let k = 0; k < 8; k++) {
    const [x0, z0] = landing(a, b), e = 1e-5;
    const [xa, za] = landing(a + e, b), [xb, zb] = landing(a, b + e);
    const J = [[(xa - x0) / e, (xb - x0) / e], [(za - z0) / e, (zb - z0) / e]];
    const det = J[0][0] * J[1][1] - J[0][1] * J[1][0];
    const dx = x - x0, dz = z - z0;
    a += (J[1][1] * dx - J[0][1] * dz) / det; b += (-J[1][0] * dx + J[0][0] * dz) / det;
  }
  return [a, b];
}

// 访问顺序：最近邻
const order = [0]; const left = WEEDS.map((_, i) => i).slice(1);
while (left.length) {
  const [lx, lz] = WEEDS[order[order.length - 1]]; let bi = 0, bd = 1e9;
  left.forEach((j, k) => { const d = Math.hypot(WEEDS[j][0] - lx, WEEDS[j][1] - lz); if (d < bd) { bd = d; bi = k; } });
  order.push(left.splice(bi, 1)[0]);
}
const JUMP = 7, DWELL = 14, PER = JUMP + DWELL;
window.FRAMES = order.length * PER + 10;
window.OFFSET = JUMP + 8;

// ---------- 标注（固定相机，位置只算一次） ----------
const hud = document.getElementById("hud"), lead = document.getElementById("lead"), wrap = document.getElementById("wrap");
function toScreen(v) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; }
function addLabel(text, anchor, dx, dy, right = false) {
  const [x, y] = toScreen(anchor), tx = x + dx, ty = y + dy;
  const d = document.createElement("div"); d.className = "lab" + (right ? " r" : ""); d.innerHTML = text;
  d.style.left = (tx + (right ? -6 : 6)) + "px"; d.style.top = (ty - 15) + "px"; wrap.appendChild(d);
  lead.insertAdjacentHTML("beforeend", `<line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}" stroke="#555" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="2.6" fill="#555"/>`);
}
addLabel("光纤", new THREE.Vector3(-300, YB - 80, -40), -90, 40, true);
addLabel("准直镜", new THREE.Vector3(-140, YB - 12, 0), -60, 70, true);
addLabel("振镜", new THREE.Vector3(-50, YB + 50, 70), -70, -50, true);
addLabel("F-θ 场镜　f = 650 mm", new THREE.Vector3(-50, LENS_BOT + 8, 40), -120, 110, true);
addLabel("作业区 350 × 350 mm", new THREE.Vector3(175, 0, 203), 80, 40);
addLabel("杂草茎部", new THREE.Vector3(WEEDS[3][0], 4, WEEDS[3][1] + 28), 140, 30);

// ---------- 局部放大：第二台相机近距离看两块镜片 ----------
const INS = { x: 905, y: 40, w: 470, h: 360 };
const camI = new THREE.PerspectiveCamera(30, INS.w / INS.h, 1, 5000);
camI.position.set(-55, YB + 80, 225); camI.lookAt(8, YB + 1, 14);
camI.updateMatrixWorld(); camI.updateProjectionMatrix();
function toInset(v) { const p = v.clone().project(camI); return [INS.x + (p.x + 1) / 2 * INS.w, INS.y + (1 - p.y) / 2 * INS.h]; }
{
  const [gx, gy] = toScreen(new THREE.Vector3(70, YB + 40, 70));
  lead.insertAdjacentHTML("beforeend",
    `<rect x="${INS.x}" y="${INS.y}" width="${INS.w}" height="${INS.h}" fill="none" stroke="#555" stroke-width="1.3"/>` +
    `<line x1="${gx}" y1="${gy}" x2="${INS.x}" y2="${INS.y + INS.h}" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/>`);
  const tag = (text, v, tx, ty) => {            // tx、ty：文字在画面上的绝对位置
    const [x, y] = toInset(v);
    const d = document.createElement("div"); d.className = "lab"; d.style.fontSize = "19px";
    d.innerHTML = text; d.style.left = tx + "px"; d.style.top = (ty - 13) + "px"; d.style.lineHeight = "1.35"; wrap.appendChild(d);
    lead.insertAdjacentHTML("beforeend", `<line x1="${x}" y1="${y}" x2="${tx + 96}" y2="${ty + 12}" stroke="#555" stroke-width="1"/><circle cx="${x}" cy="${y}" r="2.3" fill="#555"/>`);
  };
  tag("X 镜<br>绕竖直轴转<br>管 x 方向", new THREE.Vector3(-4, YB + 5, 4), INS.x + 16, INS.y + 34);
  tag("Y 镜<br>绕水平轴转<br>管 y 方向", new THREE.Vector3(8, YB - 3, 38), INS.x + 16, INS.y + 250);
  const cap = document.createElement("div"); cap.className = "lab"; cap.style.fontSize = "17px"; cap.style.color = "#444";
  cap.innerHTML = "局部放大"; cap.style.left = (INS.x + INS.w - 86) + "px"; cap.style.top = (INS.y + 8) + "px"; wrap.appendChild(cap);
}

const deg = (r) => (r >= 0 ? "+" : "−") + Math.abs(r * 180 / Math.PI).toFixed(1) + "°";
const sgn = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(0);
let cur = solve(WEEDS[order[0]][0], WEEDS[order[0]][1]);
const ease = (u) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));

window.setFrame = function (i) {
  const k = Math.min(order.length - 1, Math.floor(i / PER)), u = i - k * PER;
  const tgt = solve(WEEDS[order[k]][0], WEEDS[order[k]][1]);
  const prev = k === 0 ? tgt : solve(WEEDS[order[k - 1]][0], WEEDS[order[k - 1]][1]);
  const on = i >= order.length * PER ? false : u >= JUMP;
  const s = u < JUMP ? ease(u / JUMP) : 1;
  const a = prev[0] + (tgt[0] - prev[0]) * s, b = prev[1] + (tgt[1] - prev[1]) * s;
  const { nX, nY, d1, d2, pY } = trace(a, b);
  mirX.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), nX); mirX.position.copy(OX);
  mirY.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nY.clone().negate()); mirY.position.copy(OY);
  // 已打过的杂草留下灼痕
  burnMats.forEach((m, j) => {
    const idx = order.indexOf(j);
    m.opacity = idx < k ? 0.85 : idx === k && on ? 0.85 * Math.min(1, (u - JUMP) / DWELL) : 0;
  });
  const [lx, lz] = landing(a, b);
  const pTop = pY.clone().addScaledVector(d2, (LENS_TOP - pY.y) / d2.y);
  const pBot = pY.clone().addScaledVector(d2, (LENS_BOT - pY.y) / d2.y);
  const focus = new THREE.Vector3(lx, 0.5, lz);
  [b0, b1, b2, b3].forEach((m) => (m.visible = on));
  spot.visible = glow.visible = on;
  if (on) {
    placeBeam(b0, new THREE.Vector3(-75, YB, 0), OX, 6, 6);
    placeBeam(b1, OX, pY, 6, 6);
    placeBeam(b2, pY, pTop, 6, 6);
    placeBeam(b3, pBot, focus, 6, 1.8);
    spot.position.copy(focus); glow.position.set(lx, 0.4, lz);
  }
  hud.innerHTML = `X 镜 <b>${deg(a)}</b>　Y 镜 <b>${deg(b)}</b><br>落点 <b>(${sgn(lx - AX.x)}, ${sgn(lz - AX.z)}) mm</b><br>` +
    (on ? `<span class="red">● 出光</span>` : `○ 关光跳转`);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, W, H);
  renderer.render(scene, cam);
  // 放大视窗：只清深度，背景填白
  renderer.setScissorTest(true);
  renderer.setScissor(INS.x, H - INS.y - INS.h, INS.w, INS.h);
  renderer.setViewport(INS.x, H - INS.y - INS.h, INS.w, INS.h);
  renderer.setClearColor(0xffffff, 1); renderer.clear(true, true, true);
  const hide = [ground, field, shell, edges, barrel, ring, ring2, glass];
  hide.forEach((o) => (o.visible = false));
  renderer.render(scene, camI);
  hide.forEach((o) => (o.visible = true));
  renderer.setScissorTest(false);
};
window.ready = true;
</script></body></html>
