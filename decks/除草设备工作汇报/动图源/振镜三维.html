<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url("node_modules/@fontsource/noto-sans-sc/400.css");
  @import url("node_modules/@fontsource/noto-sans-sc/500.css");
  html, body { margin: 0; background: #fff; overflow: hidden; }
  #wrap { position: relative; width: 1600px; height: 900px; font-family: 'Noto Sans SC', sans-serif; color: #111; }
  canvas { display: block; }
  .lab { position: absolute; font-size: 30px; white-space: nowrap; line-height: 1.25; }
  .lab.r { transform: translateX(-100%); }
  .lab.s { font-size: 25px; }
  #hud { position: absolute; left: 1060px; top: 505px; width: 530px; font-size: 30px; line-height: 1.7; }
  #hud .k { display: inline-block; width: 200px; }
  #hud b { font-weight: 500; }
  .red { color: #A6011C; }
  svg.lead { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head><body>
<div id="wrap"><div id="hud"></div><svg class="lead" id="lead" width="1600" height="900"></svg></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1600, H = 900;
const MAIN = { x: 0, y: 0, w: 1040, h: 900 };          // 主视图
const INS = { x: 1060, y: 36, w: 510, h: 440 };        // 镜片放大
const F = 650;                                          // 场镜焦距 mm
const YB = 760;                                         // 入射光束高度（相对地面）
const OX = new THREE.Vector3(0, YB, 0);                 // X 镜中心
const OY = new THREE.Vector3(0, YB, 30);                // Y 镜中心
const LENS_TOP = YB - 50, LENS_BOT = YB - 120;          // 场镜镜筒上下端
const AX = new THREE.Vector3(0, 0, 30);                 // 场镜光轴与地面交点

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;
document.getElementById("wrap").prepend(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

const cam = new THREE.PerspectiveCamera(25, MAIN.w / MAIN.h, 10, 10000);
cam.position.set(1500, 1240, 1950); cam.lookAt(-40, 405, 40);
cam.updateMatrixWorld(); cam.updateProjectionMatrix();

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(450, 1500, 800); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -500, right: 500, top: 500, bottom: -500, near: 200, far: 3200 });
scene.add(sun);

// ---------- 地面：土壤 + 作业区 ----------
function soilTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d"); g.fillStyle = "#e4d9c6"; g.fillRect(0, 0, 1024, 1024);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 12000; i++) {
    const v = 185 + rnd() * 45 | 0; g.fillStyle = `rgba(${v},${v - 16},${v - 38},${0.25 + rnd() * 0.4})`;
    g.beginPath(); g.arc(rnd() * 1024, rnd() * 1024, 0.8 + rnd() * 3.2, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(300, 96), new THREE.MeshStandardMaterial({ map: soilTexture(), roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, 30); ground.receiveShadow = true; scene.add(ground);
const fieldPts = [[-175, -175], [175, -175], [175, 175], [-175, 175], [-175, -175]].map(([x, z]) => new THREE.Vector3(x, 0.6, z + 30));
const field = new THREE.Line(new THREE.BufferGeometry().setFromPoints(fieldPts), new THREE.LineDashedMaterial({ color: 0x333333, dashSize: 12, gapSize: 8 }));
field.computeLineDistances(); scene.add(field);

// ---------- 杂草：叶片 + 茎部；打过的留下灼痕 ----------
const WEEDS = [[-118, 96], [-36, -108], [64, 36], [142, -58], [-138, -34], [18, 142], [118, 122], [-60, 20]];
const leafMat = new THREE.MeshStandardMaterial({ color: 0x4f8a2e, roughness: 0.7, side: THREE.DoubleSide });
const burnMats = [], weedMats = [];
const GREEN = new THREE.Color(0x4f8a2e), BROWN = new THREE.Color(0x9a7a3c);
function leafGeom(len, wid) {
  const s = new THREE.Shape(); s.moveTo(0, 0);
  s.quadraticCurveTo(wid, len * 0.45, 0, len); s.quadraticCurveTo(-wid, len * 0.45, 0, 0);
  return new THREE.ShapeGeometry(s, 10);
}
WEEDS.forEach(([x, z], k) => {
  const g = new THREE.Group(); g.position.set(x, 0, z + 30);
  const lm = leafMat.clone(); weedMats.push(lm);          // 每株单独材质：打过后变黄褐
  const n = 6 + (k % 3);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(leafGeom(36 + (i * 9 + k * 5) % 20, 9), lm);
    m.rotation.order = "YXZ"; m.rotation.y = (i / n) * Math.PI * 2 + k; m.rotation.x = -0.75 - (i % 2) * 0.35; m.castShadow = true; g.add(m);
  }
  const burn = new THREE.Mesh(new THREE.CircleGeometry(7, 28), new THREE.MeshBasicMaterial({ color: 0x2a1a10, transparent: true, opacity: 0 }));
  burn.rotation.x = -Math.PI / 2; burn.position.y = 0.8; g.add(burn); burnMats.push(burn.material);
  scene.add(g);
});

// ---------- 材质 ----------
const metal = new THREE.MeshStandardMaterial({ color: 0xa3abb4, metalness: 0.85, roughness: 0.3 });
const dark = new THREE.MeshStandardMaterial({ color: 0x33373d, metalness: 0.55, roughness: 0.45 });
const anod = new THREE.MeshStandardMaterial({ color: 0x24272b, metalness: 0.4, roughness: 0.5 });
const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xdfe7ef, metalness: 0.65, roughness: 0.14, emissive: 0x5d6873, emissiveIntensity: 0.45 });
const mirrorEdge = new THREE.MeshStandardMaterial({ color: 0x8f98a2, metalness: 0.6, roughness: 0.35 });

// ---------- 振镜头：外壳（半透明）+ 两个电机 + 两块镜片 ----------
const shell = new THREE.Mesh(new THREE.BoxGeometry(124, 100, 118), new THREE.MeshStandardMaterial({ color: 0xc5cbd2, transparent: true, opacity: 0.14, roughness: 0.4, depthWrite: false }));
shell.position.set(10, YB + 8, 22); scene.add(shell);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(shell.geometry), new THREE.LineBasicMaterial({ color: 0x5f666e }));
edges.position.copy(shell.position); scene.add(edges);
const motX = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 44, 40), dark); motX.position.set(0, YB + 56, 0); motX.castShadow = true; scene.add(motX);
const shaftX = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 26, 16), metal); shaftX.position.set(0, YB + 22, 0); scene.add(shaftX);
const motY = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 44, 40), dark); motY.rotation.z = Math.PI / 2; motY.position.set(58, YB, 30); motY.castShadow = true; scene.add(motY);
const shaftY = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 26, 16), metal); shaftY.rotation.z = Math.PI / 2; shaftY.position.set(25, YB, 30); scene.add(shaftY);

// 振镜镜片：长圆形，镀银面 + 侧边；X 镜小（14 × 24 mm），Y 镜大（20 × 34 mm）
function mirrorMesh(w, h, t) {
  const r = w / 2, s = new THREE.Shape();
  s.moveTo(-r, -h / 2 + r); s.lineTo(-r, h / 2 - r); s.absarc(0, h / 2 - r, r, Math.PI, 0, true);
  s.lineTo(r, -h / 2 + r); s.absarc(0, -h / 2 + r, r, 0, Math.PI, true);
  const geo = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 24 });
  geo.translate(0, 0, -t);                                 // 正面在 z = 0
  return new THREE.Mesh(geo, [mirrorMat, mirrorEdge]);
}
const mirX = mirrorMesh(14, 24, 2); scene.add(mirX);
const mirY = mirrorMesh(20, 34, 2.4); scene.add(mirY);
function orient(mesh, n, along) {                          // 正面法线 = n，镜片长边沿 along
  const z = n.clone().normalize(), y = along.clone().addScaledVector(z, -along.dot(z)).normalize(), x = new THREE.Vector3().crossVectors(y, z);
  mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}

// ---------- 准直镜筒 + 光纤 ----------
const coll = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, 92, 40), metal);
coll.rotation.z = Math.PI / 2; coll.position.set(-122, YB, 0); coll.castShadow = true; scene.add(coll);
const sma = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, 22, 24), dark); sma.rotation.z = Math.PI / 2; sma.position.set(-179, YB, 0); scene.add(sma);
const fiberCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(-190, YB, 0), new THREE.Vector3(-245, YB, -8), new THREE.Vector3(-300, YB - 70, -30), new THREE.Vector3(-320, YB - 210, -30)]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(fiberCurve, 48, 3.4, 12), new THREE.MeshStandardMaterial({ color: 0xe0a530, roughness: 0.5 })));

// ---------- F-θ 场镜：黑色镜筒 + 底部镜片 ----------
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(56, 60, LENS_TOP - LENS_BOT, 72, 1, true), anod);
barrel.position.set(0, (LENS_TOP + LENS_BOT) / 2, 30); barrel.castShadow = true; scene.add(barrel);
const rings = [];
for (const yy of [LENS_TOP - 2, LENS_TOP - 14, LENS_BOT + 4]) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(yy > LENS_BOT + 10 ? 57 : 61, 1.6, 10, 72), dark);
  r.rotation.x = Math.PI / 2; r.position.set(0, yy, 30); scene.add(r); rings.push(r);
}
const topCap = new THREE.Mesh(new THREE.RingGeometry(14, 56, 72), anod); topCap.rotation.x = -Math.PI / 2; topCap.position.set(0, LENS_TOP, 30); scene.add(topCap);
const glass = new THREE.Mesh(new THREE.SphereGeometry(150, 72, 16, 0, Math.PI * 2, 0, 0.38),
  new THREE.MeshPhysicalMaterial({ color: 0x9fc4e3, roughness: 0.05, metalness: 0.0, transparent: true, opacity: 0.55, clearcoat: 1 }));
glass.rotation.x = Math.PI; glass.position.set(0, LENS_BOT + 150 - 6, 30); scene.add(glass);

// ---------- 光束 ----------
const beamMat = new THREE.MeshBasicMaterial({ color: 0xd8213a, transparent: true, opacity: 0.7, depthWrite: false });
function makeBeam() { const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 24, 1, true), beamMat); scene.add(m); return m; }
const b0 = makeBeam(), b1 = makeBeam(), b2 = makeBeam(), b3 = makeBeam();
function placeBeam(m, a, b, r0, r1) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  m.geometry.dispose(); m.geometry = new THREE.CylinderGeometry(r1, r0, len, 28, 1, true);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}
const spot = new THREE.Mesh(new THREE.CircleGeometry(5, 32), new THREE.MeshBasicMaterial({ color: 0xff2a1a }));
spot.rotation.x = -Math.PI / 2; scene.add(spot);
const glow = new THREE.Mesh(new THREE.CircleGeometry(20, 40), new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true, opacity: 0.35, depthWrite: false }));
glow.rotation.x = -Math.PI / 2; scene.add(glow);

// ---------- 光路：两次反射 + F-θ ----------
const reflect = (d, n) => d.clone().addScaledVector(n, -2 * d.dot(n));
const nX0 = new THREE.Vector3(-1, 0, 1).normalize();      // 入射 +x → 出射 +z
const nY0 = new THREE.Vector3(0, -1, -1).normalize();     // 入射 +z → 出射 −y
function trace(a, b) {                                    // a、b：X、Y 镜机械转角（弧度）
  const nX = nX0.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
  const d1 = reflect(new THREE.Vector3(1, 0, 0), nX);
  const nY = nY0.clone().applyAxisAngle(new THREE.Vector3(1, 0, 0), b);
  const t = new THREE.Vector3().subVectors(OY, OX).dot(nY) / d1.dot(nY);
  const pY = OX.clone().addScaledVector(d1, t);
  return { nX, nY, d1, d2: reflect(d1, nY), pY };
}
function landing(a, b) {                                  // F-θ：落点 = f × 光学偏转角
  const { d2 } = trace(a, b);
  return [AX.x + F * Math.atan2(d2.x, -d2.y), AX.z + F * Math.atan2(d2.z, -d2.y)];
}
function solve(x, z) {                                    // 牛顿迭代：由茎部坐标反求两镜转角
  let a = (x - AX.x) / F / 2, b = -(z - AX.z) / F / 2;
  for (let k = 0; k < 8; k++) {
    const [x0, z0] = landing(a, b), e = 1e-5;
    const [xa, za] = landing(a + e, b), [xb, zb] = landing(a, b + e);
    const J = [[(xa - x0) / e, (xb - x0) / e], [(za - z0) / e, (zb - z0) / e]];
    const det = J[0][0] * J[1][1] - J[0][1] * J[1][0], dx = x - x0, dz = z - z0;
    a += (J[1][1] * dx - J[0][1] * dz) / det; b += (-J[1][0] * dx + J[0][0] * dz) / det;
  }
  return [a, b];
}

const order = [0]; const rest = WEEDS.map((_, i) => i).slice(1);
while (rest.length) {
  const [lx, lz] = WEEDS[order[order.length - 1]]; let bi = 0, bd = 1e9;
  rest.forEach((j, k) => { const d = Math.hypot(WEEDS[j][0] - lx, WEEDS[j][1] - lz); if (d < bd) { bd = d; bi = k; } });
  order.push(rest.splice(bi, 1)[0]);
}
const JUMP = 8, DWELL = 16, PER = JUMP + DWELL;
window.FRAMES = order.length * PER + 10;
window.OFFSET = JUMP + 9;

// ---------- 标注 ----------
const hud = document.getElementById("hud"), lead = document.getElementById("lead"), wrap = document.getElementById("wrap");
function toView(v, c, V) { const p = v.clone().project(c); return [V.x + (p.x + 1) / 2 * V.w, V.y + (1 - p.y) / 2 * V.h]; }
function addLabel(text, v, tx, ty, opt = {}) {           // tx、ty：文字锚点（画面绝对坐标）
  const [x, y] = toView(v, opt.cam || cam, opt.view || MAIN);
  const d = document.createElement("div"); d.className = "lab" + (opt.right ? " r" : "") + (opt.small ? " s" : "");
  d.innerHTML = text; d.style.left = (tx + (opt.right ? -6 : 6)) + "px"; d.style.top = (ty - 16) + "px"; wrap.appendChild(d);
  const ex = tx + (opt.endDx || 0), ey = ty + (opt.endDy || 0);                      // 引线终点（文字在左、目标在右时接到文字右侧）
  lead.insertAdjacentHTML("beforeend", `<line x1="${x}" y1="${y}" x2="${ex}" y2="${ey}" stroke="#444" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="2.8" fill="#444"/>`);
}
function at(v) { return toView(v, cam, MAIN); }
{
  let p;
  p = at(new THREE.Vector3(-318, YB - 175, -30)); addLabel("光纤", new THREE.Vector3(-318, YB - 175, -30), p[0] - 60, p[1] + 30, { right: true });
  p = at(new THREE.Vector3(-140, YB + 13, 0)); addLabel("准直镜", new THREE.Vector3(-140, YB + 13, 0), p[0] - 50, p[1] - 40, { right: true });
  p = at(new THREE.Vector3(-52, YB + 58, -37)); p = at(new THREE.Vector3(0, YB + 78, 0)); addLabel("振镜（X、Y 两轴）", new THREE.Vector3(0, YB + 78, 0), p[0] + 60, p[1] - 30);
  p = at(new THREE.Vector3(58, (LENS_TOP + LENS_BOT) / 2, 30)); addLabel("F-θ 场镜<br>f = 650 mm", new THREE.Vector3(58, (LENS_TOP + LENS_BOT) / 2, 30), p[0] + 70, p[1] + 20);
  p = at(new THREE.Vector3(175, 0, 205)); addLabel("作业区 350 × 350 mm", new THREE.Vector3(175, 0, 205), p[0] + 40, p[1] + 44);
  p = at(new THREE.Vector3(WEEDS[3][0], 4, WEEDS[3][1] + 30)); addLabel("杂草茎部", new THREE.Vector3(WEEDS[3][0], 4, WEEDS[3][1] + 30), p[0] + 90, p[1] - 30);
  // 放大框与连线
  const [gx, gy] = at(new THREE.Vector3(72, YB + 58, -36));
  lead.insertAdjacentHTML("beforeend",
    `<rect x="${INS.x}" y="${INS.y}" width="${INS.w}" height="${INS.h}" fill="none" stroke="#444" stroke-width="1.3"/>` +
    `<line x1="${gx}" y1="${gy}" x2="${INS.x}" y2="${INS.y + 80}" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/>`);
}

// 放大视窗相机：从斜前方看两块镜片
const camI = new THREE.PerspectiveCamera(30, INS.w / INS.h, 1, 5000);
camI.position.set(-165, YB + 75, 130); camI.lookAt(14, YB - 2, 16);
camI.updateMatrixWorld(); camI.updateProjectionMatrix();
addLabel("X 镜<br>绕竖直轴", new THREE.Vector3(-3, YB + 6, 3), INS.x + 18, INS.y + 60, { cam: camI, view: INS, small: true, endDx: 108, endDy: 16 });
addLabel("Y 镜<br>绕水平轴", new THREE.Vector3(6, YB - 5, 40), INS.x + 18, INS.y + INS.h - 78, { cam: camI, view: INS, small: true, endDx: 108, endDy: 16 });
{
  const d = document.createElement("div"); d.className = "lab s"; d.style.color = "#555";
  d.innerHTML = "镜片放大"; d.style.left = (INS.x + INS.w - 112) + "px"; d.style.top = (INS.y + 10) + "px"; wrap.appendChild(d);
}

const deg = (r) => (r >= 0 ? "+" : "−") + Math.abs(r * 180 / Math.PI).toFixed(1) + "°";
const sgn = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(0);
const ease = (u) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));
const hideInInset = [ground, field, shell, edges, barrel, glass, topCap, ...rings];

window.setFrame = function (i) {
  const k = Math.min(order.length - 1, Math.floor(i / PER)), u = i - k * PER;
  const tgt = solve(WEEDS[order[k]][0], WEEDS[order[k]][1]);
  const prev = k === 0 ? tgt : solve(WEEDS[order[k - 1]][0], WEEDS[order[k - 1]][1]);
  const on = i < order.length * PER && u >= JUMP;
  const s = u < JUMP ? ease(u / JUMP) : 1;
  const a = prev[0] + (tgt[0] - prev[0]) * s, b = prev[1] + (tgt[1] - prev[1]) * s;
  const { nX, nY, d1, d2, pY } = trace(a, b);
  orient(mirX, nX, new THREE.Vector3(0, 1, 0)); mirX.position.copy(OX);
  orient(mirY, nY.clone().negate().negate(), new THREE.Vector3(1, 0, 0)); mirY.position.copy(OY);
  burnMats.forEach((m, j) => {
    const idx = order.indexOf(j);
    const h = idx < k ? 1 : idx === k && on ? Math.min(1, (u - JUMP) / DWELL) : 0;   // 受照程度
    m.opacity = 0.85 * h;
    weedMats[j].color.copy(GREEN).lerp(BROWN, h);
  });
  const [lx, lz] = landing(a, b);
  const pTop = pY.clone().addScaledVector(d2, (LENS_TOP - pY.y) / d2.y);
  const pBot = pY.clone().addScaledVector(d2, (LENS_BOT + 4 - pY.y) / d2.y);
  const focus = new THREE.Vector3(lx, 0.6, lz);
  [b0, b1, b2, b3].forEach((m) => (m.visible = on));
  spot.visible = glow.visible = on;
  if (on) {
    placeBeam(b0, new THREE.Vector3(-76, YB, 0), OX, 6, 6);
    placeBeam(b1, OX, pY, 6, 6);
    placeBeam(b2, pY, pTop, 6, 6);
    placeBeam(b3, pBot, focus, 6, 1.8);
    spot.position.copy(focus); glow.position.set(lx, 0.4, lz);
  }
  hud.innerHTML =
    `<span class="k">X 镜转角</span><b>${deg(a)}</b><br>` +
    `<span class="k">Y 镜转角</span><b>${deg(b)}</b><br>` +
    `<span class="k">落点</span><b>(${sgn(lx - AX.x)}, ${sgn(lz - AX.z)}) mm</b><br>` +
    (on ? `<span class="red">● 出光，打击茎部</span>` : `○ 关光，跳转下一株`);
  renderer.setScissorTest(false);
  renderer.setClearColor(0xffffff, 1); renderer.clear(true, true, true);
  renderer.setViewport(MAIN.x, H - MAIN.y - MAIN.h, MAIN.w, MAIN.h);
  renderer.render(scene, cam);
  renderer.setScissorTest(true);
  renderer.setScissor(INS.x, H - INS.y - INS.h, INS.w, INS.h);
  renderer.setViewport(INS.x, H - INS.y - INS.h, INS.w, INS.h);
  renderer.clear(true, true, true);
  hideInInset.forEach((o) => (o.visible = false));
  renderer.render(scene, camI);
  hideInInset.forEach((o) => (o.visible = true));
  renderer.setScissorTest(false);
};
window.ready = true;
</script></body></html>
